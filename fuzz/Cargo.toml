[package]
name = "siralos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "Fuzz targets for Siralos structured-input boundaries (nightly only)"

# This crate is intentionally NOT a workspace member: fuzzing requires a
# nightly toolchain and must never enter the stable quality gate. The
# root workspace `exclude`s this directory.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
siralos-core = { path = "../crates/siralos-core" }
siralos-cli = { path = "../crates/siralos-cli" }
serde_json = "1"

[[bin]]
name = "version_parse"
path = "fuzz_targets/version_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_args"
path = "fuzz_targets/cli_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "corpus_scenario"
path = "fuzz_targets/corpus_scenario.rs"
test = false
doc = false
bench = false
