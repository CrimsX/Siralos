[package]
name = "domain-abi-wit-host"
version = "0.0.0"
edition = "2024"
publish = false
description = "WIT component host for the domain-ABI prototype (assurance contract Part 17). Standalone experiment."

[workspace]

[dependencies]
wasmtime = { version = "=47.0.3", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
wasmtime-wasi = { version = "=47.0.3", default-features = false, features = ["p2"] }

[profile.release]
opt-level = 3
