# Siralos dependency update policy (pre-Stage-4 assurance contract
# Part 2). Weekly and registry-scoped. Cargo and npm updates remain
# isolated per dependency so compiler, linter, hashing, and sandbox
# changes receive independent validation. GitHub Actions updates may
# remain grouped. Dependabot PRs receive no privileged execution.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
