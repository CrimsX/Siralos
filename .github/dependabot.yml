# Siralos dependency update policy (pre-Stage-4 assurance contract
# Part 2). Weekly and registry-scoped. Cargo and npm updates remain
# isolated per dependency so compiler, linter, hashing, and sandbox
# changes receive independent validation. GitHub Actions updates may
# remain grouped. Dependabot PRs receive no privileged execution.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (8.x) caps its peer at <6.1.0; a TypeScript 7
      # bump breaks `npm ci` peer validation on every fresh install
      # (observed 2026-08-23). Re-allow when typescript-eslint widens.
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
