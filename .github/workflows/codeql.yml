name: Siralos CodeQL

# Static security scanning (Rust + the TypeScript reference) per the
# pre-Stage-4 assurance contract Part 2. The TypeScript workspace is a
# large, security-relevant surface (provider boundary, sanitizer,
# sandbox conformance), so it is analyzed alongside Rust. Separate from
# ordinary validation; the only job that holds security-events: write
# (required to upload results to the security tab). Never runs
# untrusted PR code with privileges.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (Rust + JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: rust, javascript-typescript
          # No paths-ignore: the workspace is small; scan everything.

      - name: Build (autobuild)
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
