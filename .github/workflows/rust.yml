name: Siralos Rust CI

# Validation CI only: no release, no publication, no dependency updates,
# no Godot acquisition. Rust is the sole source of truth post-TS-archive
# (decision 40, ADR 0032/0033). Differential harness runs in pinned mode
# against tests/differential/evidence/typescript-freeze-v32/oracle.json;
# live TS oracle requires worktree at freeze SHA and is never part of check.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least privilege: ordinary Rust validation needs read-only contents.
# No write authority, no secrets, no id-token. The separate CodeQL workflow
# scopes security-events: write to its own analysis job.
permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 24.17.0
  NPM_VERSION: 11.13.0
  # Pinned revision of the external Godot plugin. The differential harness
  # (`harness/`) is the only component that depends on it, and it resolves it
  # from `../siralos-godot`, so CI must check that revision out beside the
  # repository before any differential step. The plugin is public, so this
  # needs no token and no secret. W1.6 replaces this with a cargo git-rev pin
  # (decision 62); until then this constant is the single source of the pin.
  #
  # This is the revision the local evidence was produced against: the plugin's
  # HEAD, working tree clean. docs/AGENTS.md still record the older 1bf2ca3
  # pin; 1bf2ca3 is an ancestor of this revision whose only difference is a
  # formatting-only commit, so the two are behaviourally identical. The stale
  # reference is owned by W1.6/W2.x and must be reconciled there — do not
  # "correct" this constant to match the stale documents, because this is the
  # revision the parity evidence actually ran against.
  SIRALOS_GODOT_SHA: c8777b1bc5abc214e5092a489aef62ad1f0b9b41

jobs:
  gate:
    name: Rust gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1 (GitHub-owned, immutable SHA pin).
      # Credentials are not persisted: no authenticated Git operation
      # happens after checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml is the single source of truth for the exact
      # channel (currently 1.97.1) and its components (rustfmt, clippy);
      # `rustup show` installs them. No hardcoded version here.
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned npm
        shell: bash
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify JavaScript toolchain identity
        run: |
          node -e "const { execFileSync } = require('node:child_process'); const expectedNode = 'v' + process.env.NODE_VERSION; if (process.version !== expectedNode) throw new Error('expected Node ' + expectedNode + ', got ' + process.version); const npm = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (npm !== process.env.NPM_VERSION) throw new Error('expected npm ' + process.env.NPM_VERSION + ', got ' + npm);"

      # The acceptance criterion for the workspace layout: a bare checkout
      # with no Godot plugin beside it must RESOLVE. This runs before the
      # cargo cache is restored so a warm cache cannot mask a broken resolve,
      # and `--no-deps` neither compiles nor touches the network.
      - name: Resolve workspace from a clean clone (no Godot sibling)
        run: |
          test ! -e ../siralos-godot
          cargo metadata --no-deps --locked > /dev/null

      # Reconstructible cargo artifacts only: registry, git checkouts,
      # and the workspace target directory. Keyed on OS, toolchain, and
      # Cargo.lock; correctness never depends on a cache hit.
      - name: Cache cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check (prettier, minimal)
        run: npm run format:check

      - name: Lint (eslint, minimal)
        run: npm run lint

      - name: Documentation links
        run: npm run check:docs

      - name: Project-context contract
        run: npm run check:context

      - name: Identity ratchet
        run: npm run check:identity

      - name: Public-hygiene ratchet
        run: npm run check:public

      - name: Secret-hygiene ratchet
        run: npm run check:secrets

      # The product workspace has no feature flags: the differential harness
      # moved to its own excluded workspace (`harness/`) and is compiled,
      # linted and tested by dedicated steps below.
      - name: Format check
        run: cargo fmt --all --check

      - name: Check (locked, all targets, all features)
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Documentation (warnings denied)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

      # The harness is a separate, excluded workspace, so no `--workspace`
      # command above can see it. Compile, lint and test it explicitly, into
      # the shared target directory.
      - name: Harness format check
        run: cargo fmt --manifest-path harness/Cargo.toml --all --check

      - name: Harness clippy (warnings denied)
        run: cargo clippy --manifest-path harness/Cargo.toml --target-dir target --all-targets --locked -- -D warnings

      - name: Harness test (locked)
        run: cargo test --manifest-path harness/Cargo.toml --target-dir target --all-targets --locked

      - name: Test (locked, all targets, all features)
        run: cargo test --workspace --all-targets --all-features --locked

      - name: CLI identity and help (default features)
        run: |
          cargo run --locked --bin siralos -- --version
          cargo run --locked --bin siralos -- --help

      # Core-without-Godot proof: siralos-core must build with no
      # optional domain dependency (architecture ratchet re-checks the
      # forbidden-symbol boundary separately).
      - name: Core-only check (no optional domain)
        run: cargo check -p siralos-core --locked

      # Supply-chain gate (docs/development/SUPPLY_CHAIN.md): cargo-deny
      # pinned at the version validated locally; advisories, licenses,
      # wildcards, sources, and duplicate-version signals.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Dependency policy (cargo deny)
        run: cargo deny --locked check

      # The harness workspace is excluded from the product graph, so the
      # `cargo deny` above never sees it. Check it separately.
      - name: Dependency policy (cargo deny, harness workspace)
        run: cargo deny --manifest-path harness/Cargo.toml --locked check

      # The differential harness builds the external plugin crate from
      # `../siralos-godot`, so CI checks out the pinned revision beside the
      # repository. Public repository: no token, no secret.
      - name: Check out the pinned Godot plugin (differential dependency)
        run: |
          git clone --quiet https://github.com/CrimsX/siralos-godot ../siralos-godot
          git -C ../siralos-godot checkout --quiet "${SIRALOS_GODOT_SHA}"

      - name: Verify the plugin checkout is present
        run: |
          test -d ../siralos-godot
          test -f ../siralos-godot/Cargo.toml

      # The migration's audit remediation gate (ADR 0033): pinned oracle vs
      # candidate canonical records; POSIX scenarios execute here. The corpus
      # version is echoed at run time rather than hardcoded in this label —
      # a hardcoded number rots (this step still said "v33" at corpus v82).
      - name: Differential harness (pinned oracle)
        run: |
          node -e "const m=require('./tests/differential/corpus/manifest.json'); if(!(m.corpusVersion>0)) throw new Error('corpus version missing'); console.log('differential corpus version', m.corpusVersion);"
          npm run check:differential

      # A green differential run proves nothing if it executed no scenarios.
      # Assert the audit is real before any later step trusts this job.
      - name: Assert the differential audit is real (non-zero coverage)
        run: |
          node -e "const a=require('./tests/differential/out/audit.json'); if(!(a.applicableScenarios>0)) throw new Error('differential audit covered zero applicable scenarios'); if(!(a.requiredScenarios>0)) throw new Error('differential audit required zero scenarios'); if(a.parityHeld!==true) throw new Error('differential parity not held'); console.log('differential covered', a.applicableScenarios, 'applicable of', a.requiredScenarios, 'required scenarios');"

      # Synthetic conformance-domain freshness (ADR 0034): the checked-in
      # component fixtures must be rebuildable from the pinned WIT and
      # guests exactly. A diff here means a PR changed the WIT/guests but
      # did not refresh fixture bytes/digests.
      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - name: Rebuild domain conformance fixtures
        run: npm run build:domain-conformance

      - name: Verify conformance fixtures are current
        run: git diff --exit-code -- tests/domain-conformance/fixtures

      # The harness output is intentionally gitignored. Retain the exact
      # oracle, candidate, and comparison records as reviewable CI evidence,
      # including on parity failure or harness error.
      - name: Upload differential evidence (Linux)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-linux-${{ github.sha }}
          path: |
            tests/differential/out/oracle.json
            tests/differential/out/candidate.json
            tests/differential/out/audit.json
            tests/differential/out/failure.json
          if-no-files-found: warn
        if: always()

      # Rust-specific repository ratchet (ADR 0032).
      - name: Rust architecture ratchet
        run: node scripts/check-rust-architecture.mjs

  platform:
    name: Rust platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # The windows-gnu host needs GNU dlltool/as for raw-dylib imports.
      # Verify the runner image contract without coupling the workflow to one
      # package manager's installation path.
      - name: Verify MinGW-w64 host tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($tool in @('dlltool.exe', 'as.exe')) {
            if ($null -eq (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "required MinGW-w64 host tool is unavailable: $tool"
            }
          }

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned npm
        shell: bash
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify JavaScript toolchain identity
        shell: bash
        run: |
          node -e "const { execFileSync } = require('node:child_process'); const expectedNode = 'v' + process.env.NODE_VERSION; if (process.version !== expectedNode) throw new Error('expected Node ' + expectedNode + ', got ' + process.version); const npm = process.platform === 'win32' ? execFileSync(process.env.ComSpec ?? 'cmd.exe', ['/d', '/s', '/c', 'npm.cmd --version'], { encoding: 'utf8' }).trim() : execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (npm !== process.env.NPM_VERSION) throw new Error('expected npm ' + process.env.NPM_VERSION + ', got ' + npm);"

      - name: Cache cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Platform-sensitive Stage 1-3 behavior: paths, environment
      # propagation, state-dir resolution, CLI exit codes.
      - name: Check (locked, all targets, all features)
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test (locked, all targets, all features)
        run: cargo test --workspace --all-targets --all-features --locked

      # The harness is excluded from the product workspace; cover it per OS so
      # Windows-only harness breakage cannot escape a Linux-only gate.
      - name: Harness clippy (warnings denied)
        run: cargo clippy --manifest-path harness/Cargo.toml --target-dir target --all-targets --locked -- -D warnings

      - name: Harness test (locked)
        run: cargo test --manifest-path harness/Cargo.toml --target-dir target --all-targets --locked

      - name: CLI identity and help (default features)
        run: |
          cargo run --locked --bin siralos -- --version
          cargo run --locked --bin siralos -- --help

      # The harness builds the external plugin crate from `../siralos-godot`.
      - name: Check out the pinned Godot plugin (differential dependency)
        shell: bash
        run: |
          git clone --quiet https://github.com/CrimsX/siralos-godot ../siralos-godot
          git -C ../siralos-godot checkout --quiet "${SIRALOS_GODOT_SHA}"

      - name: Verify the plugin checkout is present
        shell: bash
        run: |
          test -d ../siralos-godot
          test -f ../siralos-godot/Cargo.toml

      # The differential harness runs the platform's own state-dir
      # scenarios (Windows scenarios on windows-latest; POSIX scenarios
      # on macos-latest), exercising the home-resolution contract on
      # every supported OS. Pinned oracle is used (no TS tree). The corpus
      # version is echoed at run time rather than hardcoded in this label.
      - name: Differential harness (pinned oracle)
        shell: bash
        run: |
          node -e "const m=require('./tests/differential/corpus/manifest.json'); if(!(m.corpusVersion>0)) throw new Error('corpus version missing'); console.log('differential corpus version', m.corpusVersion);"
          npm run check:differential

      # A green differential run proves nothing if it executed no scenarios.
      - name: Assert the differential audit is real (non-zero coverage)
        shell: bash
        run: |
          node -e "const a=require('./tests/differential/out/audit.json'); if(!(a.applicableScenarios>0)) throw new Error('differential audit covered zero applicable scenarios'); if(!(a.requiredScenarios>0)) throw new Error('differential audit required zero scenarios'); if(a.parityHeld!==true) throw new Error('differential parity not held'); console.log('differential covered', a.applicableScenarios, 'applicable of', a.requiredScenarios, 'required scenarios');"

      - name: Upload differential evidence (${{ matrix.os }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-${{ matrix.os }}-${{ github.sha }}
          path: |
            tests/differential/out/oracle.json
            tests/differential/out/candidate.json
            tests/differential/out/audit.json
            tests/differential/out/failure.json
          if-no-files-found: warn
        if: always()

      - name: Core-only check (no optional domain)
        run: cargo check -p siralos-core --locked

  msrv:
    name: Minimum supported Rust 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cargo.toml declares 1.85 as the MSRV. Test it directly rather
      # than treating the edition floor as evidence of compatibility.
      - name: Install exact MSRV
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check workspace at MSRV (locked, all targets, all features)
        # `cargo check` is the compatibility proof for every target and
        # feature. Behavioral execution remains on the pinned stable and
        # Tier-1 matrix; duplicating it at MSRV adds no API coverage.
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked
