[package]
name = "siralos-core"
description = "Domain-neutral host semantics and types for Siralos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Provider-neutral JSON values at the external provider/tool-result boundary
# (Stage 3R R7.1): the standard library has no JSON representation.
serde_json = "1"

[dev-dependencies]
proptest = "1"
criterion = "0.7"

[[bench]]
name = "version_parse"
harness = false

[[bench]]
name = "task_baseline"
harness = false

[[bench]]
name = "language_normalization"
harness = false

[lints]
workspace = true