[package]
name = "siralos-adapters"
description = "Infrastructure and adapter ownership for Siralos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
siralos-core = { workspace = true }
# `dirs` provides the OS user-database home fallback (Windows
# FOLDERID_Profile, POSIX getpwuid) behind a safe wrapper; the standard
# library has no equivalent and hand-rolling it would require unsafe FFI.
dirs = "6"
# JSON tool-input parsing and checkpoint metadata documents: the
# standard library has no JSON parser.
serde_json = "1"

[lints]
workspace = true
