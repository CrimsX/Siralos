[package]
name = "siralos-cli"
description = "Siralos command-line entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
siralos-core = { workspace = true }
siralos-adapters = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
time = { workspace = true }
toml_edit = { workspace = true }
[[bin]]
name = "siralos"
path = "src/main.rs"

[dev-dependencies]
# Test-only JSON fixtures (`serde_json::json!` in `output.rs`/`tui.rs`
# tests): the optional runtime dependency above is absent with default
# features, so test builds need their own edge. Dev-dependencies do not
# ship in the runtime graph.
serde_json = "1"

[lints]
workspace = true
