[workspace]
resolver = "3"
members = [
    "crates/siralos-core",
    "crates/siralos-adapters",
    "crates/siralos-cli",
]
# Excluded from the product workspace:
#   fuzz    — nightly-only; must never enter the stable quality gate
#             (docs/development/SUPPLY_CHAIN.md toolchain policy).
#   harness — dev-only differential harness (ADR 0033). It is the only
#             component that depends on the external Godot plugin crate,
#             so excluding it keeps a bare `git clone` buildable.
# Exclusion is the only Cargo boundary at which a manifest stops being
# read — an optional dependency would still be resolved.
exclude = ["fuzz", "harness"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
siralos-core = { path = "crates/siralos-core", version = "0.0.0" }
siralos-adapters = { path = "crates/siralos-adapters", version = "0.0.0" }
crossterm = { version = "=0.29.0" }
ratatui = { version = "=0.30.2" }
time = { version = "0.3", features = ["local-offset", "formatting"] }
toml_edit = { version = "0.22" }
